<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>monthsleft — stats</title>
<style>
  :root {
    --bg: #0A0A0A;
    --card: #141414;
    --card-line: #262626;
    --ink: #FFFFFF;
    --ink-soft: #8A8A8A;
    --accent: #FF8A3D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 24px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .row .key {
    color: var(--ink-soft);
    font-family: 'Space Grotesk', monospace;
  }
  .row .val {
    color: var(--ink);
    font-weight: 700;
  }
  .row.total .val {
    color: var(--accent);
  }
  .empty, .error {
    color: var(--ink-soft);
    font-size: 13px;
  }
  input#key {
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 13px;
    width: 100%;
    margin-bottom: 12px;
  }
  button {
    padding: 10px 16px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #0A0A0A;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>MCP tool-call stats</h1>
  <div class="sub">Reads directly from the /stats function. Refresh anytime.</div>
  <div id="keybox"></div>
  <div id="results"><div class="empty">Loading…</div></div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var savedKey = params.get('key') || localStorage.getItem('stats_key') || '';

  function render(data) {
    var results = document.getElementById('results');
    var entries = Object.entries(data).sort((a, b) => a[0].localeCompare(b[0]));
    if (entries.length === 0) {
      results.innerHTML = '<div class="empty">No calls tracked yet.</div>';
      return;
    }
    results.innerHTML = entries.map(function (e) {
      var isTotal = e[0] === 'total';
      return '<div class="row' + (isTotal ? ' total' : '') + '"><span class="key">' + e[0] + '</span><span class="val">' + e[1] + '</span></div>';
    }).join('');
  }

  function load(key) {
    var url = '/.netlify/functions/stats' + (key ? '?key=' + encodeURIComponent(key) : '');
    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (key) localStorage.setItem('stats_key', key);
        render(data);
      })
      .catch(function (err) {
        document.getElementById('results').innerHTML = '<div class="error">Could not load stats (' + err.message + '). If STATS_KEY is set on the site, enter it below.</div>';
        showKeyBox();
      });
  }

  function showKeyBox() {
    var box = document.getElementById('keybox');
    if (box.dataset.shown) return;
    box.dataset.shown = '1';
    box.innerHTML = '<input id="key" placeholder="stats key" value="' + savedKey + '"><button id="go">Load</button>';
    document.getElementById('go').addEventListener('click', function () {
      load(document.getElementById('key').value.trim());
    });
  }

  load(savedKey);
</script>
</body>
</html>
